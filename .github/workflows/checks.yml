name: checks

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt check
        run: cargo fmt --check

      - name: Workspace check
        run: cargo check --workspace

      # The whole suite, not one test. Until the Rust examples were removed the
      # only `cargo test` here was an onboarding contract that asserted the
      # README mentioned `cargo run -p codimate-example-*` — so 237 real tests
      # never ran, and two of them had stopped compiling without anyone
      # noticing, because `cargo check` does not build `#[cfg(test)]` code.
      - name: Tests
        run: cargo test --workspace

  # Python is the Authoring Surface, and until now none of it ran here. The
  # cost of that showed up immediately: the wheel published to PyPI failed
  # `test_layout` because the harfbuzz it vendors rounds advances differently
  # from the system one a developer builds against, and nothing was watching.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the toolchain
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet maturin ruff

      - name: Lint
        run: .venv/bin/ruff check

      # With the `painted` extra (numpy, Pillow), so the science kit's painted
      # balls are tested rather than skipped. Text is shaped by rustybuzz, in
      # Rust, so the runner's own libraries cannot change the metrics.
      - name: Build the extension
        run: .venv/bin/maturin develop --extras painted

      # The fast suite: no video, so no ffmpeg and no typst. Rendering every
      # example takes minutes and is the job of a release, not of every push.
      - name: Tests
        run: .venv/bin/python skins/python/tests/run.py

  # Every Skin over the one Authoring Core (ADR 0030–0033): the generated files
  # match the Interface Manifest, every Conformance Example writes the same film
  # data in every language, and the JavaScript Skin's own parts work.
  skins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the toolchain
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet maturin
          cargo install --quiet wasm-bindgen-cli --version \
            "$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)"

      - name: Generated files match the Interface Manifest
        run: .venv/bin/python tools/generate.py --check

      - name: Build the Python Skin and the JavaScript engine
        # Release, as tools/check.py builds it: the Waist's budget is for
        # optimised code, and a debug build is several times slower.
        run: |
          .venv/bin/maturin develop --release
          .venv/bin/python tools/build_js.py

      - name: Conformance Examples agree in every language
        run: .venv/bin/python tools/conformance.py

      - name: The JavaScript Skin's own parts
        run: node --test skins/js/test/skin.test.ts

      - name: The Waist's overhead stays within budget
        run: .venv/bin/python tools/bench_waist.py
