<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codimate-js: play()</title>
<style>
  body { margin: 0; background: #000; display: grid; place-items: center; min-height: 100vh; }
  canvas { width: min(960px, 100vw); aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script type="module">
// Conformance Example 001, written for the browser and played live.
import * as cm from "../dist/index.js";

const walk = (ball, emit) => {
  for (const x of [640, 1080]) { ball.x = x; emit("move"); }
};
const view = (frame) => {
  const scene = new cm.Scene();
  scene.rect("floor", { h: 4, w: 1100, at: [640, 404] }).fill("#48484a");
  scene.circle("ball", { r: 40, at: [frame.state.x, 360] }).fill("#2997ff", { edge: "#ffffff" });
  scene.text("label", "ball", { size: 28, at: cm.at({ x: frame.state.x, top: 420 }) });
  return scene;
};
cm.canvas(1280, 720);
cm.explain({ trace: cm.trace(walk, { x: 200 }), view }).play(document.getElementById("screen"));
</script>
</body>
</html>
