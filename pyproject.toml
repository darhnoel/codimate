[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "codimate"
version = "0.5.0"
description = "Turn a running algorithm into an explainer video"
readme = "README.md"
requires-python = ">=3.9"
# Codimate's own code is MIT. The fonts compiled into it are not, and keep
# their own licenses, which must travel with every wheel that carries them.
license = "MIT"
license-files = ["LICENSE", "crates/codimate-fonts/fonts/LICENSES/*"]
# ffmpeg is needed for every render and pip cannot install it. This ships a
# static build per platform, used only when the system has no ffmpeg of its
# own — so `pip install codimate` is enough on a bare machine. `typst`, which
# only `scene.formula` needs, stays a documented prerequisite.
dependencies = ["imageio-ffmpeg>=0.4.9"]
# The per-version entries are not decoration: `requires-python` above is what
# pip enforces, but PyPI's sidebar and the shields.io badge both read these
# instead, and without them the badge reads "missing". One abi3-py39 wheel
# serves every version listed.
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Education",
]

# The science kit's "painted" style paints each ball's shading as an image, with
# numpy and Pillow: `pip install "codimate[painted]"`. Nothing else needs them.
[project.optional-dependencies]
painted = ["numpy>=1.21", "pillow>=9"]

[tool.maturin]
# The Waist's Python transport (ADR 0032, 0033), and the Python Skin's source.
manifest-path = "crates/codimate-waist/Cargo.toml"
python-source = "skins/python"
module-name = "codimate._codimate"
features = ["extension-module"]
# A plain `maturin develop` builds the fast engine. A debug one renders about
# 25 times slower, and nothing says so but the clock.
profile = "release"

[tool.ruff]
line-length = 88
# `weights.py` is a table of numbers taken from a real model, one row per line.
# Wrapping it would make it unreadable, and it is not hand-maintained.
extend-exclude = ["docs/api"]

[tool.ruff.lint]
# PEP 8 and pyflakes, plus the two rules this project learned the hard way:
#   PLR0913 — more than five arguments. A shape used to take eighteen.
# No "I": the tests import `support` first, on purpose, to put the package
# on the path — sorting that import away breaks them.
select = ["E", "W", "F", "PLR0913"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Generated from api/surface.toml, and the templates that generate code: their
# lines are the lines of the code they write.
"skins/python/codimate/_surface.py" = ["E501"]
"tools/generate.py" = ["E501"]
# A table of recorded calls, one per line.
"tools/record_fixtures.py" = ["E501"]

[tool.ruff.lint.pylint]
max-args = 5
