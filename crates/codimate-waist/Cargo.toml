[package]
name = "codimate-waist"
version = "0.5.0"
edition = "2021"
license.workspace = true
description = "The Waist: every Skin's one crossing into the Authoring Core and the Engine"

[lib]
crate-type = ["cdylib", "rlib"]

# One crate, a feature per transport (ADR 0032, 0033): `python` is the PyO3
# extension maturin builds, `wasm` the module JavaScript loads. Neither is on
# by default, so `cargo test --workspace` builds what they share.
[features]
python = ["dep:pyo3", "dep:codimate-core", "dep:codimate-export"]
extension-module = ["python", "pyo3/extension-module"]
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde_json"]

[dependencies]
codimate-author = { path = "../codimate-author" }
codimate-animation = { path = "../codimate-animation" }
codimate-fonts = { path = "../codimate-fonts" }
codimate-layout = { path = "../codimate-layout" }
codimate-reconcile = { path = "../codimate-reconcile" }
codimate-render = { path = "../codimate-render" }
codimate-core = { path = "../codimate-core", optional = true }
codimate-export = { path = "../codimate-export", optional = true }
# `abi3-py39` builds one wheel per platform that works on every Python from
# 3.9 up, instead of one wheel per Python version per platform — 5 wheels to
# release rather than 25. Matches `requires-python` in pyproject.toml.
pyo3 = { version = "0.22", features = ["abi3-py39"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
