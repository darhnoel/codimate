[package]
name = "codimate-math"
version = "0.1.0"
edition = "2021"

[dependencies]
codimate-core = { path = "../codimate-core" }
# See docs/adr/0005; pinned for deterministic golden images.
mitex = "0.2"                                          # LaTeX -> Typst markup
usvg = { version = "0.47", default-features = false }  # SVG  -> path geometry
# Already in the tree as a usvg dependency. Declared directly so an imported
# SVG's `<text>` can be read: usvg is built without its `text` feature and
# discards those elements while parsing, so they have to be picked up from the
# source (ADR 0014).
roxmltree = "0.21"
