[package]
name = "codimate-wasm"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "WebAssembly bindings: play a Codimate film in the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
codimate-author = { path = "../codimate-author" }
codimate-animation = { path = "../codimate-animation" }
codimate-fonts = { path = "../codimate-fonts" }
codimate-layout = { path = "../codimate-layout" }
codimate-reconcile = { path = "../codimate-reconcile" }
codimate-render = { path = "../codimate-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
