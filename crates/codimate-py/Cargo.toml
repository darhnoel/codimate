[package]
name = "codimate-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "_codimate"
crate-type = ["cdylib", "rlib"]

[dependencies]
codimate-core = { path = "../codimate-core" }
codimate-animation = { path = "../codimate-animation" }
codimate-layout = { path = "../codimate-layout" }
codimate-export = { path = "../codimate-export" }
codimate-render = { path = "../codimate-render" }
codimate-math = { path = "../codimate-math" }
# `abi3-py39` builds one wheel per platform that works on every Python from
# 3.9 up, instead of one wheel per Python version per platform — 5 wheels to
# release rather than 25. Matches `requires-python` in pyproject.toml.
pyo3 = { version = "0.22", features = ["abi3-py39"] }

# maturin turns this on for wheels; leaving it off by default keeps
# `cargo test` linkable.
[features]
extension-module = ["pyo3/extension-module"]
