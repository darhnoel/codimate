[package]
name = "codimate-author"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The Authoring Core: everything an Authoring Surface does that is not the author's own code"

[dependencies]
# The Engine, for the Queries it answers: how big text is, and the easing curve.
codimate-fonts = { path = "../codimate-fonts" }
codimate-reconcile = { path = "../codimate-reconcile" }
codimate-render = { path = "../codimate-render" }
serde = { version = "1", features = ["derive"] }
# One portable libm for every target: native and WebAssembly builds then give
# the same last bit for sin, cos and hypot, so film data is the same bytes
# from every language on every platform.
libm = "0.2"
# Python's random, seeded by a string as Python seeds it (markers).
sha2 = "0.10"
# Which characters attach to the one before them, for letter-by-letter text.
unicode-general-category = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
