<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codimate Previewer</title>
<style>
  :root {
    --ground: #14171c; --panel: #1c2027; --line: #2c323c;
    --text: #dde3ea; --quiet: #8a94a3; --accent: #58c4dd; --hit: #fc6255;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--text);
         font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
         display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
  main { display: flex; flex-direction: column; min-width: 0; padding: 16px; gap: 10px; }
  .stage { position: relative; flex: 1; min-height: 0; display: flex;
           align-items: center; justify-content: center; }
  video, img { max-width: 100%; max-height: 100%; display: block; background: #000; }
  [hidden] { display: none !important; }
  canvas { position: absolute; cursor: crosshair; }
  .bar { display: flex; gap: 8px; align-items: center; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
           border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible, input:focus-visible
    { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .time, .event { font: 13px ui-monospace, Menlo, monospace; color: var(--quiet);
                  font-variant-numeric: tabular-nums; white-space: nowrap; }
  .event { color: var(--accent); overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .error { background: #3a1d1d; border: 1px solid var(--hit); color: #ffd9d6;
           border-radius: 4px; padding: 8px 10px; font: 12px/1.5 ui-monospace, Menlo, monospace;
           white-space: pre-wrap; }
  aside { background: var(--panel); border-left: 1px solid var(--line);
          padding: 16px; display: flex; flex-direction: column; gap: 12px;
          overflow-y: auto; }
  h2 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
       color: var(--quiet); font-weight: 600; }
  pre { margin: 0; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap;
        word-break: break-word; }
  ol { margin: 0; padding-left: 20px; font: 13px ui-monospace, Menlo, monospace; }
  ol li:first-child { color: var(--hit); }
  textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--ground);
             color: var(--text); border: 1px solid var(--line); border-radius: 4px;
             padding: 8px; font: inherit; }
  .notes pre { background: var(--ground); border: 1px solid var(--line);
               border-radius: 4px; padding: 8px; max-height: 40vh; overflow-y: auto; }
  .hint { color: var(--quiet); font-size: 12px; }
  .covered { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .covered li:first-child { color: inherit; }
  .covered button { width: 100%; text-align: left; font: 12px ui-monospace, Menlo, monospace;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; height: auto; }
    .stage { min-height: 50vh; }
  }
</style>
</head>
<body>
<main>
  <div class="error" id="error" hidden></div>
  <div class="stage">
    <video id="video" preload="auto" playsinline hidden></video>
    <img id="still" alt="the film at this moment" hidden>
    <audio id="sound" preload="auto"></audio>
    <canvas id="over"></canvas>
  </div>
  <div class="bar">
    <button id="play" title="space">Play</button>
    <button data-step="-1" title="shift ←">−1s</button>
    <button data-step="-0.1" title="←">−0.1s</button>
    <button data-step="0.1" title="→">+0.1s</button>
    <button data-step="1" title="shift →">+1s</button>
    <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="time">
    <span class="time" id="time">0:00.00</span>
  </div>
  <div class="bar">
    <span class="event" id="event">—</span>
    <button id="reload" title="run the script again" hidden>Reload</button>
  </div>
</main>
<aside>
  <h2 id="title">Previewer</h2>
  <p class="hint" id="how">Click anything in the film to see what it is, which event drew it,
    and the State behind it. Nothing here changes the film.</p>
  <section id="problems" hidden>
    <h2>Covered labels</h2>
    <ol id="covered" class="covered"></ol>
  </section>
  <section>
    <h2>Under the click</h2>
    <ol id="hits"><li class="hint">nothing clicked yet</li></ol>
  </section>
  <section>
    <h2>Beat</h2>
    <pre id="found" class="hint">—</pre>
  </section>
  <section>
    <h2>Note</h2>
    <textarea id="words" placeholder="what is wrong here?"></textarea>
    <div class="bar"><button id="add">Add note</button></div>
  </section>
  <section class="notes">
    <div class="bar"><h2 style="flex:1">Notes</h2>
      <button id="copy">Copy notes</button></div>
    <pre id="notes" class="hint">none yet</pre>
  </section>
</aside>
<script>
const $ = (id) => document.getElementById(id);
const video = $("video"), still = $("still"), over = $("over"), scrub = $("scrub");
const sound = $("sound");
let heard = false;        // whether the script's film makes a sound
let index = { canvas: [1280, 720], beats: [], built: 0 };
let last = null;          // the last /at answer, for the note
const notes = [];
const stamp = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, "0")}`;

// Two sources behind one clock: a rendered mp4, or frames drawn on request
// from a script held in memory. Everything below asks `clock`, not either.
const frames = {
  t: 0, duration: 0, paused: true, want: null, busy: false, url: null,
  seek(t) {
    this.t = Math.max(0, Math.min(this.duration, t));
    if (heard && !this.paused) sound.currentTime = this.t;
    this.fetch(); tick();
  },
  fetch() {
    // One request in flight; a fast drag skips to wherever it ends up.
    this.want = this.t;
    if (this.busy) return;
    this.busy = true;
    const t = this.want; this.want = null;
    fetch(`/frame?t=${t}`).then((r) => r.blob()).then((b) => {
      if (this.url) URL.revokeObjectURL(this.url);
      this.url = URL.createObjectURL(b); still.src = this.url;
    }).finally(() => {
      this.busy = false;
      if (this.want !== null) this.fetch();
      else if (!this.paused) this.advance();
    });
  },
  advance() {
    // Playing is "as fast as frames arrive", timed by the sound if there is
    // one and the wall clock if not — so it runs at the film's speed with
    // frames dropped, never in slow motion, and the voice leads.
    const now = performance.now() / 1000;
    // Past the last clip the film still has its final hold: back to the wall clock.
    this.t = heard && !sound.ended ? sound.currentTime
                   : Math.min(this.duration, this.t + (now - (this.from ?? now)));
    this.from = now;
    if (this.t >= this.duration) this.paused = true;
    this.fetch(); tick();
  },
  play() {
    this.paused = false; this.from = performance.now() / 1000;
    if (heard) { sound.currentTime = this.t; sound.play(); }
    this.advance();
  },
  pause() { this.paused = true; this.from = null; sound.pause(); tick(); },
};
const media = {
  get t() { return video.currentTime; }, get duration() { return video.duration || 0; },
  get paused() { return video.paused; },
  seek(t) { video.currentTime = Math.max(0, Math.min(this.duration, t)); },
  play() { video.play(); }, pause() { video.pause(); },
};
let clock = frames;
const picture = () => (clock === media ? video : still);

function problems() {
  // ADR 0017: labels something is drawn on. Each jumps to where it starts
  // and outlines the pair, the way a click would.
  const list = $("covered");
  list.replaceChildren();
  $("problems").hidden = !index.covered.length;
  for (const [t, above, below] of index.covered) {
    const b = document.createElement("button");
    b.textContent = `${stamp(t)}  ${above} over ${below}`;
    b.title = b.textContent;
    b.onclick = async () => {
      clock.pause(); clock.seek(t);
      const all = await (await fetch(`/at?t=${t}`)).json();
      const pair = [above, below].map((n) => all.shapes.find((s) => s.name === n)).filter(Boolean);
      const [x, y, w, h] = pair[1]?.box ?? pair[0]?.box ?? [0, 0, 0, 0];
      last = { ...all, shapes: pair, point: [x + w / 2, y + h / 2] };
      last.seconds = clock.t;
      show(); draw();
    };
    const li = document.createElement("li");
    li.append(b); list.append(li);
  }
}

async function refresh(force) {
  const got = await (await fetch("/index" + (force ? "?force" : ""))).json();
  $("error").hidden = !got.error;
  $("error").textContent = got.error ? `The script failed; showing the last good run.\n\n${got.error}` : "";
  const changed = got.built !== index.built;
  index = got;
  if (!changed) return;
  last = null; draw(); problems(); listen(got);
  frames.duration = got.duration; scrub.max = got.duration;
  frames.seek(frames.t);
}

fetch("/index").then((r) => r.json()).then((got) => {
  index = got;
  $("title").textContent = got.title;
  document.title = `${got.title} — Codimate Previewer`;
  problems();
  if (got.video) {
    clock = media; video.src = "/video"; video.hidden = false;
  } else {
    still.hidden = false; $("reload").hidden = false;
    $("how").textContent += " Save the script and the film here follows.";
    frames.duration = got.duration; scrub.max = got.duration;
    listen(got);
    frames.seek(0);
    setInterval(() => refresh(false), 1500);
  }
});

function listen(got) {
  // A new build may have new clips; fetch the mix afresh rather than cached.
  frames.pause();
  heard = got.sound;
  if (heard) sound.src = `/sound?built=${got.built}`;
  else sound.removeAttribute("src");
}

function beatAt(t) {
  let found = null;
  for (const b of index.beats) { if (b[0] <= t) found = b; else break; }
  return found;
}

function fit() {
  // The canvas lies exactly over the picture, not over the letterbox.
  const p = picture();
  over.width = p.clientWidth; over.height = p.clientHeight;
  over.style.left = p.offsetLeft + "px"; over.style.top = p.offsetTop + "px";
  draw();
}

function draw() {
  const g = over.getContext("2d");
  g.clearRect(0, 0, over.width, over.height);
  if (!last || Math.abs(last.seconds - clock.t) > 0.02) return;
  const k = over.width / index.canvas[0];
  last.shapes.forEach((s, i) => {
    if (!s.box) return;
    const [x, y, w, h] = s.box;
    g.strokeStyle = i === 0 ? "#fc6255" : "rgba(88,196,221,.7)";
    g.lineWidth = i === 0 ? 2 : 1;
    g.strokeRect(x * k, y * k, Math.max(w * k, 1), Math.max(h * k, 1));
  });
  g.fillStyle = "#fc6255";
  g.beginPath(); g.arc(last.point[0] * k, last.point[1] * k, 3, 0, 7); g.fill();
}

function tick() {
  const t = clock.t;
  scrub.value = t;
  $("time").textContent = `${stamp(t)} / ${stamp(clock.duration)}`;
  const b = beatAt(t);
  $("event").textContent = b ? b[2] : "—";
  $("play").textContent = clock.paused ? "Play" : "Pause";
  draw();
}

video.addEventListener("loadedmetadata", () => { scrub.max = video.duration; fit(); tick(); });
for (const e of ["timeupdate", "seeked", "play", "pause"]) video.addEventListener(e, tick);
still.addEventListener("load", fit);
window.addEventListener("resize", fit);
new ResizeObserver(fit).observe(video);
new ResizeObserver(fit).observe(still);

const toggle = () => (clock.paused ? clock.play() : clock.pause());
const step = (d) => { clock.pause(); clock.seek(clock.t + d); };
$("play").onclick = toggle;
$("reload").onclick = () => refresh(true);
document.querySelectorAll("[data-step]").forEach((b) => (b.onclick = () => step(+b.dataset.step)));
scrub.oninput = () => clock.seek(+scrub.value);

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(e.shiftKey ? -1 : -0.1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); step(e.shiftKey ? 1 : 0.1); }
});

over.addEventListener("click", async (e) => {
  clock.pause();
  const k = index.canvas[0] / over.width;
  const x = e.offsetX * k, y = e.offsetY * k, t = clock.t;
  last = await (await fetch(`/at?t=${t}&x=${x}&y=${y}`)).json();
  last.point = [x, y];
  show(); draw();
  $("words").focus();
});

function show() {
  const hits = $("hits");
  hits.replaceChildren();
  if (!last.shapes.length) {
    const li = document.createElement("li");
    li.className = "hint"; li.textContent = "nothing here";
    hits.append(li);
  }
  for (const s of last.shapes) {
    const li = document.createElement("li");
    li.textContent = `${s.name}  (${s.kind ?? "shape"}, layer ${s.layer})`;
    hits.append(li);
  }
  $("found").className = "";
  $("found").textContent = last.note;
}

$("add").onclick = () => {
  if (!last) return;
  const words = $("words").value.trim();
  notes.push(last.note + (words ? `\n> ${words}` : ""));
  $("words").value = "";
  $("notes").className = "";
  $("notes").textContent = notes.join("\n\n");
};

$("copy").onclick = async () => {
  if (!notes.length) return;
  await navigator.clipboard.writeText(notes.join("\n\n") + "\n");
  $("copy").textContent = "Copied";
  setTimeout(() => ($("copy").textContent = "Copy notes"), 1200);
};
</script>
</body>
</html>
