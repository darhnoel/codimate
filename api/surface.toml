Draw this preset into a Scene or Group at one of its stable states.
'''
args = [
  { name = "group", type = "group", positional = true },
  { name = "state", type = "string", default = "\"hidden\"" },
]

[[op]]
name = "text_preset_rules"
module = "preset"
method = "rules"
on = "TextPreset"
kind = "method"
returns = "rules"
context = ["preset"]
doc = '''
Return motion rules for this preset's words, letters, and blur.
'''
args = [
  { name = "ease", type = "string", default = "\"out\"" },
  { name = "stagger", type = "number", default = "0.12" },
  { name = "order", type = "string", default = "\"screen\"" },
]

