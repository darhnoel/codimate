# The Interface Manifest (ADR 0031): every public operation of the Authoring
# Surface, once. `tools/generate.py` writes each Skin's declarations and the
# Core's dispatch table from this file; nothing generated is edited by hand.
#
# Names are snake_case here and in Python; JavaScript uses the same names in
# camelCase, by one rule, no exceptions.
#
#   name     the operation, and the method's name
#   on       where the method lives: Group (a Scene is one), Handle
#   kind     builder (draws or changes a shape) or query (answers at once)
#   context  what the Skin supplies itself, never the author:
#              group      the Group's frame (path, point, width)
#              shape      the shape a Handle stands for
#              film_font  the film's font (`font()`)
#   args     the author's arguments, in order. `positional = true` ones come
#            first and are passed by position; the rest are keyword arguments
#            in Python and one options object in JavaScript. `default` makes
#            one optional; a default of "none" means "not given".
#
# Types: key (a name or a path of names), number, text (anything shown as
# text), string, at (a point, a Slot or a Place).

[[op]]
name = "rect"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A rectangle. Say where with a point, a Slot, or `at(...)`. Round the corners with `.round(12)`."
args = [
  { name = "key", type = "key", positional = true },
  { name = "h", type = "number" },
  { name = "w", type = "number", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "circle"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A filled circle. `fill(\"none\", edge=...)` draws a ring."
args = [
  { name = "key", type = "key", positional = true },
  { name = "r", type = "number" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "text"
on = "Group"
kind = "builder"
context = ["group", "film_font"]
doc = "Text, centred horizontally. `font` is a font file or an installed font's name, for this text only; unset, the film's font."
args = [
  { name = "key", type = "key", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "size", type = "number", default = "16" },
  { name = "font", type = "string", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "fill"
on = "Handle"
kind = "builder"
context = ["shape"]
doc = "Colour it. `edge` outlines it; `color=\"none\"` leaves it unfilled. Saying nothing about the outline leaves it alone."
args = [
  { name = "color", type = "string", positional = true, default = "\"white\"" },
  { name = "edge", type = "string", default = "none" },
  { name = "edge_w", type = "number", default = "none" },
]

[[op]]
name = "line"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A line between two points. `w` is its thickness. Each end may be a Slot (a line joins the middles of two places) or a point."
args = [
  { name = "key", type = "key", positional = true },
  { name = "start", type = "point" },
  { name = "end", type = "point" },
  { name = "w", type = "number", default = "2.0" },
]

[[op]]
name = "arrow"
on = "Group"
kind = "builder"
context = ["group"]
doc = "An arrow, as a single filled shape: one name, travelling as one thing. `w` is the shaft, `head` the point."
args = [
  { name = "key", type = "key", positional = true },
  { name = "start", type = "point" },
  { name = "end", type = "point" },
  { name = "w", type = "number", default = "4.0" },
  { name = "head", type = "number", default = "16.0" },
]

[[op]]
name = "polygon"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A shape with corners. `points` is a sequence of points. Closed and filled by default; `closed=False` leaves an open outline. Two polygons tween only if they have the same number of corners."
args = [
  { name = "key", type = "key", positional = true },
  { name = "points", type = "points", positional = true },
  { name = "closed", type = "bool", default = "true" },
]

[[op]]
name = "curve"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A smooth line through every one of `points`: samples, not control points. `w` is the stroke width. Open by default; `closed=True` makes a fillable shape. Two curves tween only if they have the same number of points."
args = [
  { name = "key", type = "key", positional = true },
  { name = "points", type = "points", positional = true },
  { name = "w", type = "number", default = "2.0" },
  { name = "closed", type = "bool", default = "false" },
]

[[op]]
name = "arc"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A slice of a circle: an angle mark, a pie, a dial, an orbit. `sweep` is (start, end) in degrees, clockwise from twelve o'clock; `r` is the radius, or (rx, ry) for an ellipse. Open by default; `.round(1)` closes it into a pie slice."
args = [
  { name = "key", type = "key", positional = true },
  { name = "r", type = "radius" },
  { name = "sweep", type = "pair" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "group"
on = "Group"
kind = "builder"
returns = "Group"
context = ["group"]
doc = "A place to draw a thing made of several shapes. Give it a Slot and it sits where the Slot says (at `anchor`: center, top or bottom), or place it with `at` like any shape. Inside it, 0 is that point, and everything drawn on it moves as one."
args = [
  { name = "key", type = "key", positional = true },
  { name = "slot", type = "slot", positional = true, default = "none" },
  { name = "at", type = "at", default = "none" },
  { name = "anchor", type = "string", default = "none" },
  { name = "w", type = "number", default = "none" },
]

# -- Queries: module functions that answer at once ----------------------------
#
# returns  points (corners), slots (with their items, if given items), size
#          (w, h) or number. The Skin turns the answer into its own values.

[[op]]
name = "ngon"
on = "module"
kind = "query"
returns = "points"
context = []
doc = "The corners of a regular polygon, for `polygon`. A triangle is three sides, a hexagon six; `turn` rotates it in degrees, the first corner otherwise pointing straight up."
args = [
  { name = "sides", type = "int", positional = true },
  { name = "r", type = "number", positional = true },
  { name = "at", type = "point", default = "origin" },
  { name = "turn", type = "number", default = "0.0" },
]

[[op]]
name = "star"
on = "module"
kind = "query"
returns = "points"
context = []
doc = "The corners of a star, for `polygon`. `inner` is the radius of the valleys; it defaults to a proportion that looks like a star rather than a gear."
args = [
  { name = "points", type = "int", positional = true },
  { name = "r", type = "number", positional = true },
  { name = "inner", type = "number", default = "none" },
  { name = "at", type = "point", default = "origin" },
  { name = "turn", type = "number", default = "0.0" },
]

[[op]]
name = "row"
on = "module"
kind = "query"
returns = "slots"
context = ["canvas"]
doc = "One Slot per item, evenly spaced on a shared baseline, anchored at bottom-centre. `size` is the Slot's width (its height follows) or (w, h). `within` divides part of the canvas instead of all of it. Gives (slot, item) pairs, or bare Slots for a count."
args = [
  { name = "items", type = "items", positional = true },
  { name = "gap", type = "number", default = "40.0" },
  { name = "size", type = "radius", default = "none" },
  { name = "at", type = "at", default = "none" },
  { name = "within", type = "slot", default = "none" },
]

[[op]]
name = "column"
on = "module"
kind = "query"
returns = "slots"
context = ["canvas"]
doc = "One Slot per item, stacked vertically around a centre line, anchored at their centres. `x` places the column; it defaults to mid-canvas. Gives (slot, item) pairs, or bare Slots for a count."
args = [
  { name = "items", type = "items", positional = true },
  { name = "gap", type = "number", default = "40.0" },
  { name = "size", type = "radius", default = "none" },
  { name = "at", type = "at", default = "none" },
  { name = "within", type = "slot", default = "none" },
]

[[op]]
name = "measure"
on = "module"
kind = "query"
returns = "size"
context = ["film_font"]
doc = "How wide and tall `text` will be at `size`: (w, h). Measured by the Engine with the real fonts, fallback included, so it is right for Khmer and anything else that is not plain ASCII. The height is the line height, the same for every word."
args = [
  { name = "text", type = "text", positional = true },
  { name = "size", type = "number", positional = true, default = "16.0" },
  { name = "font", type = "string", positional = true, default = "none" },
]

[[op]]
name = "ease"
on = "module"
kind = "query"
returns = "number"
context = []
doc = "The easing curve the Engine applies between two moments: the same curve your animation uses, not a copy of it."
args = [
  { name = "t", type = "number", positional = true },
]
