# The Interface Manifest (ADR 0031): every public operation of the Authoring
# Surface, once. `tools/generate.py` writes each Skin's declarations and the
# Core's dispatch table from this file; nothing generated is edited by hand.
#
# Names are snake_case here and in Python; JavaScript uses the same names in
# camelCase, by one rule, no exceptions.
#
#   name     the operation, and the method's name
#   module   the Core module that answers it (default: surface)
#   on       where the method lives: Group (a Scene is one), Scene, Handle
#   variadic an argument that takes any number of values: `*names` in Python,
#            one array in JavaScript (an options object cannot follow rest
#            arguments there)
#   kind     builder (draws or changes a shape) or query (answers at once)
#   context  what the Skin supplies itself, never the author:
#              group      the Group's frame (path, point, width)
#              shape      the shape a Handle stands for
#              film_font  the film's font (`font()`)
#   args     the author's arguments, in order. `positional = true` ones come
#            first and are passed by position; the rest are keyword arguments
#            in Python and one options object in JavaScript. `default` makes
#            one optional; a default of "none" means "not given".
#
# Types: key (a name or a path of names), number, text (anything shown as
# text), string, at (a point, a Slot or a Place).

[[op]]
name = "rect"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A rectangle. Say where with a point, a Slot, or `at(...)`. Round the corners with `.round(12)`."
args = [
  { name = "key", type = "key", positional = true },
  { name = "h", type = "number" },
  { name = "w", type = "number", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "circle"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A filled circle. `fill(\"none\", edge=...)` draws a ring."
args = [
  { name = "key", type = "key", positional = true },
  { name = "r", type = "number" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "text"
on = "Group"
kind = "builder"
context = ["group", "film_font"]
doc = "Text, centred horizontally. `font` is a font file or an installed font's name, for this text only; unset, the film's font."
args = [
  { name = "key", type = "key", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "size", type = "number", default = "16" },
  { name = "font", type = "string", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "fill"
on = "Handle"
kind = "builder"
context = ["shape"]
doc = "Colour it. `edge` outlines it; `color=\"none\"` leaves it unfilled. Saying nothing about the outline leaves it alone."
args = [
  { name = "color", type = "string", positional = true, default = "\"white\"" },
  { name = "edge", type = "string", default = "none" },
  { name = "edge_w", type = "number", default = "none" },
]

[[op]]
name = "turn"
on = "Handle"
kind = "builder"
context = ["shape"]
doc = "Rotate it. `pivot` is center, top, bottom, left or right. Text moves but does not turn."
args = [
  { name = "degrees", type = "number", positional = true },
  { name = "pivot", type = "string", positional = true, default = "\"center\"" },
]

[[op]]
name = "grow"
on = "Handle"
kind = "builder"
context = ["shape"]
doc = "Scale it: a number for both axes, or (sx, sy) to stretch."
args = [
  { name = "scale", type = "radius", positional = true },
]

[[op]]
name = "on"
on = "Handle"
kind = "builder"
context = ["shape"]
doc = "Which layer it draws on, and how solid it is."
args = [
  { name = "layer", type = "number", positional = true, default = "none" },
  { name = "opacity", type = "number", positional = true, default = "none" },
]

[[op]]
name = "round"
on = "Handle"
kind = "builder"
context = ["shape"]
doc = "Round a rectangle's corners, clamped to half its short side."
args = [
  { name = "radius", type = "number", positional = true },
]

[[op]]
name = "write"
on = "Handle"
kind = "builder"
context = ["shape"]
doc = "How much of a formula or an imported SVG shows (`reveal`, 0 to 1), and whether a pen draws it on (`pen`, its width). On a marker, how far its stroke has been drawn on."
args = [
  { name = "reveal", type = "number", positional = true, default = "none" },
  { name = "pen", type = "number", positional = true, default = "0.0" },
]

[[op]]
name = "line"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A line between two points. `w` is its thickness. Each end may be a Slot (a line joins the middles of two places) or a point."
args = [
  { name = "key", type = "key", positional = true },
  { name = "start", type = "point" },
  { name = "end", type = "point" },
  { name = "w", type = "number", default = "2.0" },
]

[[op]]
name = "arrow"
on = "Group"
kind = "builder"
context = ["group"]
doc = "An arrow, as a single filled shape: one name, travelling as one thing. `w` is the shaft, `head` the point."
args = [
  { name = "key", type = "key", positional = true },
  { name = "start", type = "point" },
  { name = "end", type = "point" },
  { name = "w", type = "number", default = "4.0" },
  { name = "head", type = "number", default = "16.0" },
]

[[op]]
name = "polygon"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A shape with corners. `points` is a sequence of points. Closed and filled by default; `closed=False` leaves an open outline. Two polygons tween only if they have the same number of corners."
args = [
  { name = "key", type = "key", positional = true },
  { name = "points", type = "points", positional = true },
  { name = "closed", type = "bool", default = "true" },
]

[[op]]
name = "curve"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A smooth line through every one of `points`: samples, not control points. `w` is the stroke width. Open by default; `closed=True` makes a fillable shape. Two curves tween only if they have the same number of points."
args = [
  { name = "key", type = "key", positional = true },
  { name = "points", type = "points", positional = true },
  { name = "w", type = "number", default = "2.0" },
  { name = "closed", type = "bool", default = "false" },
]

[[op]]
name = "arc"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A slice of a circle: an angle mark, a pie, a dial, an orbit. `sweep` is (start, end) in degrees, clockwise from twelve o'clock; `r` is the radius, or (rx, ry) for an ellipse. Open by default; `.round(1)` closes it into a pie slice."
args = [
  { name = "key", type = "key", positional = true },
  { name = "r", type = "radius" },
  { name = "sweep", type = "pair" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "group"
on = "Group"
kind = "builder"
returns = "Group"
context = ["group"]
doc = "A place to draw a thing made of several shapes. Give it a Slot and it sits where the Slot says (at `anchor`: center, top or bottom), or place it with `at` like any shape. Inside it, 0 is that point, and everything drawn on it moves as one."
args = [
  { name = "key", type = "key", positional = true },
  { name = "slot", type = "slot", positional = true, default = "none" },
  { name = "at", type = "at", default = "none" },
  { name = "anchor", type = "string", default = "none" },
  { name = "w", type = "number", default = "none" },
]

[[op]]
name = "formula"
on = "Group"
kind = "builder"
context = ["group"]
doc = "Real mathematics, written as LaTeX. `size` means what it means for text. Draw it on with `write(reveal=, pen=)`. Typeset once when the film is built."
args = [
  { name = "key", type = "key", positional = true },
  { name = "latex", type = "string", positional = true },
  { name = "size", type = "number", default = "16.0" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "image"
on = "Group"
kind = "builder"
context = ["group"]
doc = "A picture (PNG or JPEG) drawn into the frame. `size` is a box it fits inside, one number or (w, h), aspect always kept; leave it out and it is drawn at its own pixel size."
args = [
  { name = "key", type = "key", positional = true },
  { name = "file", type = "text", positional = true },
  { name = "size", type = "radius", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "svg"
on = "Group"
kind = "builder"
context = ["group"]
doc = "Vector art from a file, drawn as real geometry: it tweens, turns, grows and draws on like anything else. `size` is a box it fits inside, one number or (w, h). It keeps its own colours unless `fill` overrides them."
args = [
  { name = "key", type = "key", positional = true },
  { name = "file", type = "text", positional = true },
  { name = "size", type = "radius", default = "120.0" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "marker"
module = "marker"
on = "Group"
kind = "builder"
returns = "marked"
context = ["group"]
doc = "A highlighter stroke over any box on screen. `.write(reveal=0..1)` draws it on from its left end; `.turn(degrees)` sets its angle; `.fill(name)` colours it: yellow, orange, pink, green, blue or purple, or any #rrggbb. Slightly translucent, under the words' layer, drawn by hand the same way every time for the same name."
args = [
  { name = "key", type = "key", positional = true },
  { name = "w", type = "number" },
  { name = "h", type = "number" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "highlight"
module = "marker"
on = "Group"
kind = "builder"
returns = "highlight"
context = ["group", "film_font"]
doc = "Words under a highlighter stroke, the stroke sized to them: gives (band, words). Marked, the words are near-black; `band.write(reveal=...)` blends them back to their own colour (white unless `words.fill(...)` says) as the stroke rubs out."
args = [
  { name = "key", type = "key", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "size", type = "number", default = "16.0" },
  { name = "font", type = "string", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "focus"
on = "Scene"
kind = "builder"
returns = "aim"
context = []
doc = "Look at these things; the camera works out where to stand. No names frames the whole canvas again. `pad` is room around them; `least` is the smallest thing the camera fills the frame with. Anything on an overlay stays where it is put."
args = [
  { name = "names", type = "keys", positional = true, variadic = true },
  { name = "pad", type = "number", default = "40.0" },
  { name = "least", type = "number", default = "240.0" },
]

[[op]]
name = "overlay"
on = "Scene"
kind = "builder"
returns = "overlay"
context = ["group"]
doc = "A place for things the camera does not move: titles and narration. The diagram pans and zooms underneath; whatever is drawn here stays put, in plain screen coordinates."
args = []

# -- Queries: module functions that answer at once ----------------------------
#
# returns  points (corners), slots (with their items, if given items), size
#          (w, h) or number. The Skin turns the answer into its own values.

[[op]]
name = "ngon"
on = "module"
kind = "query"
returns = "points"
context = []
doc = "The corners of a regular polygon, for `polygon`. A triangle is three sides, a hexagon six; `turn` rotates it in degrees, the first corner otherwise pointing straight up."
args = [
  { name = "sides", type = "int", positional = true },
  { name = "r", type = "number", positional = true },
  { name = "at", type = "point", default = "origin" },
  { name = "turn", type = "number", default = "0.0" },
]

[[op]]
name = "star"
on = "module"
kind = "query"
returns = "points"
context = []
doc = "The corners of a star, for `polygon`. `inner` is the radius of the valleys; it defaults to a proportion that looks like a star rather than a gear."
args = [
  { name = "points", type = "int", positional = true },
  { name = "r", type = "number", positional = true },
  { name = "inner", type = "number", default = "none" },
  { name = "at", type = "point", default = "origin" },
  { name = "turn", type = "number", default = "0.0" },
]

[[op]]
name = "row"
on = "module"
kind = "query"
returns = "slots"
context = ["canvas"]
doc = "One Slot per item, evenly spaced on a shared baseline, anchored at bottom-centre. `size` is the Slot's width (its height follows) or (w, h). `within` divides part of the canvas instead of all of it. Gives (slot, item) pairs, or bare Slots for a count."
args = [
  { name = "items", type = "items", positional = true },
  { name = "gap", type = "number", default = "40.0" },
  { name = "size", type = "radius", default = "none" },
  { name = "at", type = "at", default = "none" },
  { name = "within", type = "slot", default = "none" },
]

[[op]]
name = "column"
on = "module"
kind = "query"
returns = "slots"
context = ["canvas"]
doc = "One Slot per item, stacked vertically around a centre line, anchored at their centres. `x` places the column; it defaults to mid-canvas. Gives (slot, item) pairs, or bare Slots for a count."
args = [
  { name = "items", type = "items", positional = true },
  { name = "gap", type = "number", default = "40.0" },
  { name = "size", type = "radius", default = "none" },
  { name = "at", type = "at", default = "none" },
  { name = "within", type = "slot", default = "none" },
]

[[op]]
name = "measure"
on = "module"
kind = "query"
returns = "size"
context = ["film_font"]
doc = "How wide and tall `text` will be at `size`: (w, h). Measured by the Engine with the real fonts, fallback included, so it is right for Khmer and anything else that is not plain ASCII. The height is the line height, the same for every word."
args = [
  { name = "text", type = "text", positional = true },
  { name = "size", type = "number", positional = true, default = "16.0" },
  { name = "font", type = "string", positional = true, default = "none" },
]

[[op]]
name = "ease"
on = "module"
kind = "query"
returns = "number"
context = []
doc = "The easing curve the Engine applies between two moments: the same curve your animation uses, not a copy of it."
args = [
  { name = "t", type = "number", positional = true },
]

# -- Values: things an author builds and hands to `explain` -------------------
#
# A value is a class whose fields come from the Core. `options` collects every
# other keyword (Python's **options; in JavaScript, the options object's other
# fields).

[[op]]
name = "rule"
class = "Rule"
on = "module"
kind = "value"
context = []
doc = "How things matching `pattern` change; the first matching rule wins. `position` is the path: straight, linear, fall, lift_carry_drop or arc. `ease` is linear, in, out, in_out, back, spring or bounce. `delay` and `stagger` are fractions of the beat; `order` is screen, reverse, name or centre."
args = [
  { name = "pattern", type = "key", positional = true },
  { name = "position", type = "string", positional = true, default = "\"straight\"" },
  { name = "ease", type = "string", default = "none" },
  { name = "order", type = "string", default = "\"screen\"" },
  { name = "options", type = "options" },
]
fields = ["pattern", "position", "ease", "order", "options"]
payload = true

# -- Text presets: words or letters that each move into place -----------------
#
# A value's methods are `kind = "method"` entries `on` the value's class; the
# value's own fields reach the Core as the `preset` context. A shortcut makes
# a value with some arguments fixed.

[[op]]
name = "text_preset_style"
module = "preset"
class = "TextPresetStyle"
on = "module"
kind = "value"
context = []
doc = "Text appearance and travel distance shared by a preset's words or letters. `size` is in canvas points; `font` and `fill` are optional; `distance` is how far each starts from its place."
args = [
  { name = "size", type = "number", default = "16.0" },
  { name = "font", type = "string", default = "none" },
  { name = "fill", type = "string", default = "none" },
  { name = "distance", type = "number", default = "48.0" },
]
fields = ["size", "font", "fill", "distance"]

[[op]]
name = "text_preset"
module = "preset"
class = "TextPreset"
on = "module"
kind = "value"
context = []
doc = "Text drawn as individually moving words or letters. `preset` is words_up, words_down, letters_up, letters_down, words_left, words_right or words_up_blur. Draw it in a state (hidden or shown; blurred too for words_up_blur) and pass its rules() to explain."
args = [
  { name = "name", type = "string", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "preset", type = "string", positional = true },
  { name = "style", type = "style", default = "none" },
  { name = "at", type = "at", default = "none" },
]
fields = ["name", "content", "preset", "style", "at"]
field_types = { style = "TextPresetStyle" }

[[op]]
name = "text_preset_draw"
module = "preset"
method = "draw"
on = "TextPreset"
kind = "method"
returns = "handles"
context = ["preset", "film_font"]
doc = "Draw this preset into a Scene or Group at one of its stable states."
args = [
  { name = "group", type = "group", positional = true },
  { name = "state", type = "string", default = "\"hidden\"" },
]

[[op]]
name = "text_preset_rules"
module = "preset"
method = "rules"
on = "TextPreset"
kind = "method"
returns = "rules"
context = ["preset"]
doc = "The motion rules for this preset's words or letters, and its blur."
args = [
  { name = "ease", type = "string", default = "\"out\"" },
  { name = "stagger", type = "number", default = "0.12" },
  { name = "order", type = "string", default = "\"screen\"" },
]

[[op]]
name = "words_up"
makes = "TextPreset"
on = "module"
kind = "shortcut"
fixed = { preset = "words_up" }
context = []
doc = "A text preset that brings words up into place."
args = [
  { name = "name", type = "string", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "style", type = "style", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "words_down"
makes = "TextPreset"
on = "module"
kind = "shortcut"
fixed = { preset = "words_down" }
context = []
doc = "A text preset that brings words down into place."
args = [
  { name = "name", type = "string", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "style", type = "style", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "letters_up"
makes = "TextPreset"
on = "module"
kind = "shortcut"
fixed = { preset = "letters_up" }
context = []
doc = "A text preset that brings letter clusters up into place."
args = [
  { name = "name", type = "string", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "style", type = "style", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "letters_down"
makes = "TextPreset"
on = "module"
kind = "shortcut"
fixed = { preset = "letters_down" }
context = []
doc = "A text preset that brings letter clusters down into place."
args = [
  { name = "name", type = "string", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "style", type = "style", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "words_left"
makes = "TextPreset"
on = "module"
kind = "shortcut"
fixed = { preset = "words_left" }
context = []
doc = "A text preset that brings words in from the left."
args = [
  { name = "name", type = "string", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "style", type = "style", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "words_right"
makes = "TextPreset"
on = "module"
kind = "shortcut"
fixed = { preset = "words_right" }
context = []
doc = "A text preset that brings words in from the right."
args = [
  { name = "name", type = "string", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "style", type = "style", default = "none" },
  { name = "at", type = "at", default = "none" },
]

[[op]]
name = "words_up_blur"
makes = "TextPreset"
on = "module"
kind = "shortcut"
fixed = { preset = "words_up_blur" }
context = []
doc = "A text preset that brings soft, blurred words up into focus."
args = [
  { name = "name", type = "string", positional = true },
  { name = "content", type = "text", positional = true },
  { name = "style", type = "style", default = "none" },
  { name = "at", type = "at", default = "none" },
]

# -- Axes: a map from numbers to pixels (ADR 0016) -----------------------------
#
# `line` calls the author's own function, which only their language can run:
# its form is "sampled": the Core gives the x values (`axes_samples`), the Skin
# asks the author's function for each y, and the Core maps them (`then`).

[[op]]
name = "axes"
module = "axes"
class = "Axes"
on = "module"
kind = "value"
context = ["canvas"]
doc = "A map from your numbers to pixels. `x` and `y` are (low, high); `size` is (w, h) in pixels, or one number for a square, defaulting to most of the canvas; `at` places the box's centre, and `within` fits it to part of the canvas. It returns points rather than drawing, so what you plot is a shape with a name of yours."
args = [
  { name = "x", type = "pair" },
  { name = "y", type = "pair" },
  { name = "at", type = "at", default = "none" },
  { name = "size", type = "radius", default = "none" },
  { name = "within", type = "slot", default = "none" },
]
fields = ["x0", "x1", "y0", "y1", "left", "top", "w", "h", "ink", "label", "layer", "right", "bottom"]

[[op]]
name = "axes_looks"
module = "axes"
method = "looks"
on = "Axes"
kind = "method"
returns = "value"
returns_class = "Axes"
context = ["axes"]
doc = "Restyle the frame, ticks and labels. Returns a new Axes."
args = [
  { name = "ink", type = "string", positional = true, default = "none" },
  { name = "label", type = "number", positional = true, default = "none" },
  { name = "layer", type = "number", positional = true, default = "none" },
]

[[op]]
name = "axes_at"
module = "axes"
method = "at"
on = "Axes"
kind = "method"
returns = "point"
context = ["axes"]
doc = "One data point as a pixel pair, for any shape's `at`."
args = [
  { name = "x", type = "number", positional = true },
  { name = "y", type = "number", positional = true },
]

[[op]]
name = "axes_samples"
then = "axes_points"
module = "axes"
method = "line"
on = "Axes"
kind = "method"
returns = "sampled"
context = ["axes"]
doc = "steps + 1 points along y = f(x), as pixels, for a curve. `over=(lo, hi)` samples part of the range. Every sample is kept, even outside the box: curves only tween when their point counts match."
args = [
  { name = "f", type = "function", positional = true },
  { name = "steps", type = "int", positional = true, default = "200" },
  { name = "over", type = "pair", positional = true, default = "none" },
]

[[op]]
name = "axes_ticks"
module = "axes"
method = "ticks"
on = "Axes"
kind = "method"
returns = "ticks"
context = ["axes"]
doc = "(n, value, label) per tick, where n, the step multiple, is what a tick is named after: an integer cannot drift."
args = [
  { name = "axis", type = "string", positional = true, default = "\"x\"" },
  { name = "about", type = "int", positional = true, default = "6" },
]

[[op]]
name = "axes_draw"
module = "axes"
method = "draw"
on = "Axes"
kind = "method"
returns = "drawn"
context = ["axes", "film_font"]
doc = "Draw the frame, ticks and labels, each named under `name`. Returns the Axes, for chaining. Colours and sizes come from `looks`."
args = [
  { name = "group", type = "group", positional = true },
  { name = "name", type = "key", positional = true, default = "\"plot\"" },
  { name = "about", type = "int", default = "6" },
  { name = "grid", type = "bool", default = "false" },
]

[[op]]
name = "axes"
makes = "Axes"
on = "module"
kind = "shortcut"
fixed = {}
context = []
doc = "A coordinate map from your numbers to pixels: see Axes. `x` and `y` are (low, high)."
args = [
  { name = "x", type = "pair" },
  { name = "y", type = "pair" },
  { name = "at", type = "at", default = "none" },
  { name = "size", type = "radius", default = "none" },
  { name = "within", type = "slot", default = "none" },
]
